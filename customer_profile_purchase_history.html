<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0F1117;--card:#1C2030;--card2:#222636;--border:#2A2F3E;--text:#E8EAF0;--muted:#7A82A0;--accent:#6366F1;--green:#10B981;--amber:#F59E0B;--red:#EF4444;--blue:#3B82F6;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:24px;min-height:100vh;}
h2{font-size:17px;font-weight:700;margin-bottom:2px;}
.pg-sub{font-size:12px;color:var(--muted);margin-bottom:20px;}
input,select,textarea{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--text);font-family:inherit;outline:none;}
input:focus,select:focus{border-color:var(--accent);}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;border:none;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-ghost{background:var(--card2);color:var(--text);border:1px solid var(--border);}
.main-layout{display:grid;grid-template-columns:300px 1fr;gap:16px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px;}
.card-hd{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:13px;font-weight:700;}
.card-body{padding:16px 18px;}
.cust-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04);transition:background .15s;}
.cust-item:hover{background:rgba(255,255,255,.03);}
.cust-item.active{background:rgba(99,102,241,.1);border-left:2px solid var(--accent);}
.cust-item:last-child{border-bottom:none;}
.c-avatar{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;}
.c-name{font-size:13px;font-weight:600;}
.c-meta{font-size:11px;color:var(--muted);}
.c-spend{text-align:right;font-size:13px;font-weight:700;color:var(--green);white-space:nowrap;}
.c-orders{font-size:10px;color:var(--muted);}
.profile-header{display:flex;align-items:center;gap:20px;margin-bottom:20px;}
.p-avatar{width:68px;height:68px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff;flex-shrink:0;}
.p-name{font-size:22px;font-weight:800;margin-bottom:2px;}
.p-sub{font-size:12px;color:var(--muted);}
.p-badges{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px;display:inline-block;}
.b-vip{background:rgba(245,158,11,.2);color:#fcd34d;}
.b-active{background:rgba(16,185,129,.15);color:#6ee7b7;}
.b-overdue{background:rgba(239,68,68,.15);color:#fca5a5;}
.b-paid{background:rgba(16,185,129,.15);color:#6ee7b7;}
.b-pending{background:rgba(245,158,11,.15);color:#fcd34d;}
.b-del{background:rgba(99,102,241,.15);color:#a5b4fc;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
.stat-card{background:var(--card2);border-radius:10px;padding:12px 14px;}
.stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:5px;}
.stat-val{font-size:20px;font-weight:800;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:8px 0;text-align:left;border-bottom:1px solid var(--border);}
.tbl td{padding:10px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,.04);}
.tbl tr:last-child td{border-bottom:none;}
.timeline{position:relative;padding-left:20px;}
.tl-item{position:relative;padding-bottom:18px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute;left:-20px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--accent);}
.tl-line{position:absolute;left:-17px;top:12px;bottom:0;width:2px;background:var(--border);}
.tl-item:last-child .tl-line{display:none;}
.tl-date{font-size:10px;color:var(--muted);margin-bottom:2px;}
.tl-title{font-size:13px;font-weight:600;}
.tl-sub{font-size:12px;color:var(--muted);}
.tl-amount{font-size:13px;font-weight:700;color:var(--green);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.info-item{background:var(--card2);border-radius:8px;padding:10px 12px;}
.info-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:3px;}
.info-val{font-size:13px;font-weight:600;}
.pending-bar{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:10px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.pending-label{font-size:12px;color:#fca5a5;font-weight:600;}
.pending-val{font-size:18px;font-weight:800;color:var(--red);}
.search-bar{padding:10px 14px;border-bottom:1px solid var(--border);}
.search-bar input{width:100%;}
</style>

<h2>👥 Customer Profiles & Purchase History</h2>
<p class="pg-sub">360° customer view · Order timeline · Payment tracking · Notes</p>

<div class="main-layout">
  <!-- LEFT: CUSTOMER LIST -->
  <div>
    <div class="card" style="margin-bottom:0;">
      <div class="card-hd"><span class="card-title">All Customers</span><span style="font-size:12px;font-weight:700;color:var(--accent);" id="cust-count">6 total</span></div>
      <div class="search-bar"><input type="text" placeholder="🔍 Search customers..." id="custSearch" oninput="renderCustList()"></div>
      <div id="custList"></div>
    </div>
  </div>

  <!-- RIGHT: CUSTOMER DETAIL -->
  <div id="custDetail">
    <div style="display:flex;align-items:center;justify-content:center;height:300px;color:var(--muted);font-size:14px;">← Select a customer to view their profile</div>
  </div>
</div>

<script>
var customers=[
  {id:0,name:'Rahul Verma',phone:'+91 98765 43210',email:'rahul@email.com',loc:'Gomti Nagar, Lucknow',gstin:'',color:'#6366F1',totalSpend:82500,pending:0,orders:3,since:'Jan 2024',tag:'VIP',
    purchases:[
      {date:'04 Apr 2026',item:'Golden Retriever Pup',inv:'INV-0042',amount:31360,status:'Paid'},
      {date:'12 Jan 2026',item:'Royal Canin Dog Food (3kg) x2',inv:'INV-0031',amount:2520,status:'Paid'},
      {date:'18 Mar 2025',item:'Pomeranian Female Pup',inv:'INV-0018',amount:15680,status:'Paid'},
    ],
    notes:'Long-time customer. Loves Golden Retrievers. Prefers WhatsApp updates.'
  },
  {id:1,name:'Priya Singh',phone:'+91 99887 76655',email:'priya@email.com',loc:'Hazratganj, Lucknow',gstin:'',color:'#EC4899',totalSpend:11800,pending:0,orders:1,since:'Mar 2026',tag:'Active',
    purchases:[
      {date:'03 Apr 2026',item:'Persian Cat (White Female)',inv:'INV-0040',amount:11800,status:'Paid'},
    ],
    notes:'First-time buyer. Very happy with the Persian cat. Follow up for accessories.'
  },
  {id:2,name:'Amit Kumar',phone:'+91 90000 12345',email:'amit@email.com',loc:'Aliganj, Lucknow',gstin:'09AMITK1234Z1',color:'#F59E0B',totalSpend:44145,pending:5145,orders:2,since:'Nov 2025',tag:'Overdue',
    purchases:[
      {date:'01 Apr 2026',item:'Royal Canin Medium (3kg x4)',inv:'INV-0039',amount:5145,status:'Pending'},
      {date:'15 Nov 2025',item:'Husky Pup (Blue Eyes)',inv:'INV-0022',amount:39000,status:'Paid'},
    ],
    notes:'GST customer. Has a pending payment of ₹5,145. Called twice, will pay by 10th.'
  },
  {id:3,name:'Sneha Rao',phone:'+91 88776 65544',email:'sneha@email.com',loc:'Indira Nagar, Lucknow',gstin:'',color:'#10B981',totalSpend:39200,pending:39200,orders:1,since:'Apr 2026',tag:'Overdue',
    purchases:[
      {date:'02 Apr 2026',item:'Labrador Retriever (Chocolate)',inv:'INV-0038',amount:39200,status:'Pending'},
    ],
    notes:'New customer. Balance pending. Promised UPI transfer by weekend.'
  },
  {id:4,name:'Vikram Srivastava',phone:'+91 77665 54433',email:'vikram@email.com',loc:'Rajajipuram, Lucknow',gstin:'09VIKRS5678A1Z',color:'#3B82F6',totalSpend:68500,pending:0,orders:4,since:'Jun 2023',tag:'VIP',
    purchases:[
      {date:'20 Mar 2026',item:'Shih Tzu Female Pup',inv:'INV-0036',amount:18000,status:'Paid'},
      {date:'10 Dec 2025',item:'Whiskas Cat Food x6',inv:'INV-0024',amount:5100,status:'Paid'},
      {date:'22 Jul 2025',item:'Cockatiel (Hand Tamed)',inv:'INV-0015',amount:4500,status:'Paid'},
      {date:'30 Jun 2023',item:'Labrador Puppy Male',inv:'INV-0003',amount:16800,status:'Paid'},
    ],
    notes:'Excellent customer. Has multiple pets. Referral source for 3 other buyers.'
  },
  {id:5,name:'Meena Gupta',phone:'+91 66554 43322',email:'meena@email.com',loc:'Alambagh, Lucknow',gstin:'',color:'#8B5CF6',totalSpend:14200,pending:0,orders:2,since:'Sep 2025',tag:'Active',
    purchases:[
      {date:'05 Feb 2026',item:'Dog Collar + Leash Set',inv:'INV-0033',amount:1150,status:'Paid'},
      {date:'14 Sep 2025',item:'Persian Cat (Blue Eyes)',inv:'INV-0019',amount:13050,status:'Paid'},
    ],
    notes:'Loves cats. May be interested in another Persian or Siamese.'
  },
];

var activeCust=null;

function tagCls(t){return t==='VIP'?'b-vip':t==='Overdue'?'b-overdue':'b-active';}
function payCls(s){return s==='Paid'?'b-paid':s==='Pending'?'b-pending':'b-del';}

function renderCustList(){
  var s=document.getElementById('custSearch').value.toLowerCase();
  var list=customers.filter(function(c){return!s||c.name.toLowerCase().includes(s)||c.phone.includes(s)||c.loc.toLowerCase().includes(s);});
  document.getElementById('cust-count').textContent=list.length+' total';
  document.getElementById('custList').innerHTML=list.map(function(c){
    return '<div class="cust-item'+(activeCust===c.id?' active':'')+'" onclick="showCust('+c.id+')">'
      +'<div class="c-avatar" style="background:'+c.color+';">'+c.name[0]+'</div>'
      +'<div style="flex:1;min-width:0;">'
      +'<div class="c-name">'+c.name+'</div>'
      +'<div class="c-meta">'+c.phone+' · '+c.orders+' orders</div>'
      +'</div>'
      +'<div style="text-align:right;flex-shrink:0;">'
      +'<div class="c-spend">₹'+Number(c.totalSpend).toLocaleString('en-IN')+'</div>'
      +'<span class="badge '+tagCls(c.tag)+'" style="font-size:9px;">'+c.tag+'</span>'
      +'</div>'
      +'</div>';
  }).join('');
}

function showCust(id){
  activeCust=id;
  renderCustList();
  var c=customers[id];
  var detail=document.getElementById('custDetail');
  var pendingBar=c.pending>0?'<div class="pending-bar"><div><div class="pending-label">Pending Payment</div><div style="font-size:11px;color:var(--muted);">Overdue — please follow up</div></div><div class="pending-val">₹'+Number(c.pending).toLocaleString('en-IN')+'</div></div>':'';
  detail.innerHTML='<div class="profile-header">'
    +'<div class="p-avatar" style="background:'+c.color+';">'+c.name[0]+c.name.split(' ')[1][0]+'</div>'
    +'<div><div class="p-name">'+c.name+'</div><div class="p-sub">'+c.email+' · '+c.phone+'</div>'
    +'<div class="p-badges"><span class="badge '+tagCls(c.tag)+'">'+c.tag+'</span>'+(c.gstin?'<span class="badge b-del">GST Registered</span>':'')+' <span style="font-size:11px;color:var(--muted);">Customer since '+c.since+'</span></div>'
    +'</div>'
    +'<div style="margin-left:auto;display:flex;gap:8px;">'
    +'<button class="btn btn-ghost" style="font-size:12px;padding:7px 14px;">💬 WhatsApp</button>'
    +'<button class="btn btn-primary" style="font-size:12px;padding:7px 14px;">+ New Invoice</button>'
    +'</div>'
    +'</div>'
    +'<div class="stats-row">'
    +'<div class="stat-card"><div class="stat-label">Total Spent</div><div class="stat-val" style="color:var(--green);">₹'+Number(c.totalSpend).toLocaleString('en-IN')+'</div></div>'
    +'<div class="stat-card"><div class="stat-label">Pending</div><div class="stat-val" style="color:'+(c.pending>0?'var(--red)':'var(--muted)')+';">₹'+Number(c.pending).toLocaleString('en-IN')+'</div></div>'
    +'<div class="stat-card"><div class="stat-label">Total Orders</div><div class="stat-val">'+c.orders+'</div></div>'
    +'<div class="stat-card"><div class="stat-label">Avg. Order</div><div class="stat-val">₹'+Math.round(c.totalSpend/c.orders).toLocaleString('en-IN')+'</div></div>'
    +'</div>'
    +pendingBar
    +'<div class="card">'
    +'<div class="card-hd"><span class="card-title">Purchase History</span><span style="font-size:11px;color:var(--muted);">'+c.purchases.length+' orders</span></div>'
    +'<div class="card-body" style="padding:14px 18px;">'
    +'<table class="tbl"><thead><tr><th>Date</th><th>Item</th><th>Invoice</th><th>Amount</th><th>Status</th></tr></thead><tbody>'
    +c.purchases.map(function(p){return '<tr><td style="color:var(--muted);font-size:12px;">'+p.date+'</td><td style="font-weight:600;">'+p.item+'</td><td style="font-family:monospace;font-size:11px;color:var(--muted);">'+p.inv+'</td><td style="font-weight:700;color:var(--green);">₹'+Number(p.amount).toLocaleString('en-IN')+'</td><td><span class="badge '+payCls(p.status)+'">'+p.status+'</span></td></tr>';}).join('')
    +'</tbody></table>'
    +'</div></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">'
    +'<div class="card" style="margin:0;"><div class="card-hd"><span class="card-title">Contact Details</span></div><div class="card-body"><div class="info-grid">'
    +'<div class="info-item"><div class="info-label">Phone</div><div class="info-val">'+c.phone+'</div></div>'
    +'<div class="info-item"><div class="info-label">Location</div><div class="info-val">'+c.loc+'</div></div>'
    +'<div class="info-item"><div class="info-label">Email</div><div class="info-val" style="font-size:12px;">'+c.email+'</div></div>'
    +'<div class="info-item"><div class="info-label">GSTIN</div><div class="info-val" style="font-size:12px;">'+(c.gstin||'Not Registered')+'</div></div>'
    +'</div></div></div>'
    +'<div class="card" style="margin:0;"><div class="card-hd"><span class="card-title">Internal Notes</span><span style="font-size:11px;color:var(--accent);cursor:pointer;">Edit</span></div><div class="card-body"><div style="font-size:13px;color:var(--muted);line-height:1.6;">'+c.notes+'</div></div></div>'
    +'</div>';
}

renderCustList();
showCust(0);
</script>
